on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: "2.36.0"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Set R user cache directory
        shell: bash
        run: echo "R_USER_CACHE_DIR=$RUNNER_TEMP/r-user-cache" >> "$GITHUB_ENV"

      # CmdStan and the compiled bisonR models are cached separately. CmdStan is
      # saved straight after a successful install; models only after a
      # successful job, so a cancelled job can't save a partial install.
      - name: Restore CmdStan
        id: cmdstan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release

      - name: Restore compiled models
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: models-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release-${{ hashFiles('inst/stan/*.stan') }}

      - name: Install CmdStan
        id: install-cmdstan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        shell: Rscript {0}
        run: |
          cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)
          stopifnot(file.exists(file.path(cmdstanr::cmdstan_path(), "bin")))

      - name: Save CmdStan
        if: steps.install-cmdstan.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release

      - name: Test coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package"))
          print(cov)
          covr::to_cobertura(cov)

      - name: Save compiled models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: models-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release-${{ hashFiles('inst/stan/*.stan') }}
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
