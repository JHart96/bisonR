# Builds the pkgdown site on every PR (so broken docs are caught before merge)
# and deploys it to the gh-pages branch (served at https://bisonr.org) only on
# pushes to main and on releases.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: "2.36.0"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The runner image version is part of the cache keys, so CmdStan and the
      # compiled models are rebuilt when GitHub updates the compilers.
      - name: Set cache directory and image version
        shell: bash
        run: |
          echo "R_USER_CACHE_DIR=$RUNNER_TEMP/r-user-cache" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # CmdStan and the compiled bisonR models are cached separately. CmdStan is
      # saved straight after a successful install; models only after a
      # successful job, so a cancelled job can't save a partial install.
      - name: Restore CmdStan
        id: cmdstan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-v2-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ env.IMAGE_VERSION }}-release

      - name: Restore compiled models
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: models-v2-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ env.IMAGE_VERSION }}-release-${{ hashFiles('inst/stan/*.stan') }}

      - name: Install CmdStan
        id: install-cmdstan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        shell: Rscript {0}
        run: |
          cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)
          stopifnot(file.exists(file.path(cmdstanr::cmdstan_path(), "bin")))

      - name: Save CmdStan
        if: steps.install-cmdstan.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-v2-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ env.IMAGE_VERSION }}-release

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Save compiled models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: models-v2-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ env.IMAGE_VERSION }}-release-${{ hashFiles('inst/stan/*.stan') }}
      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          clean: false
          branch: gh-pages
          folder: docs
