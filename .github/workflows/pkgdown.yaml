# Builds the pkgdown site on every PR (so broken docs are caught before merge)
# and deploys it to the gh-pages branch (served at https://bisonr.org) only on
# pushes to main and on releases.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CMDSTAN_VERSION: "2.36.0"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Set R user cache directory
        shell: bash
        run: echo "R_USER_CACHE_DIR=$RUNNER_TEMP/r-user-cache" >> "$GITHUB_ENV"

      - name: Restore CmdStan and compiled models
        id: stan-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cmdstan
            ${{ runner.temp }}/r-user-cache
          key: stan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release-${{ hashFiles('inst/stan/*.stan') }}
          restore-keys: |
            stan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release-

      - name: Install CmdStan
        shell: Rscript {0}
        run: |
          if (is.null(tryCatch(cmdstanr::cmdstan_path(), error = function(e) NULL))) {
            cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)
          }

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Save CmdStan and compiled models
        if: always() && steps.stan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cmdstan
            ${{ runner.temp }}/r-user-cache
          key: stan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-release-${{ hashFiles('inst/stan/*.stan') }}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          clean: false
          branch: gh-pages
          folder: docs
