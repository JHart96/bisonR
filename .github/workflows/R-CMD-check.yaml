# R CMD check on all three major platforms.
#
# Runs on pull requests, and on pushes to main and feature/fix branches.
# Release branches are checked through their pull request rather than on every
# push, so the matrix doesn't run twice per commit.
#
# Articles (vignettes) are not rebuilt here: the pkgdown workflow renders every
# article on each pull request. brms-based tests run on Linux (release) only.
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  brms: 'false'}
          - {os: windows-latest, r: 'release',  brms: 'false'}
          - {os: ubuntu-latest,  r: 'release',  brms: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1', brms: 'false'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # bisonR isn't on CRAN and depends on cmdstanr (also not on CRAN), so skip
      # the CRAN submission checks, which would otherwise always warn.
      _R_CHECK_CRAN_INCOMING_: false
      CMDSTAN_VERSION: "2.36.0"
      BISONR_TEST_BRMS: ${{ matrix.config.brms }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Compiled bisonR Stan models are stored in tools::R_user_dir(), which
      # follows R_USER_CACHE_DIR, so they can be cached between runs.
      - name: Set R user cache directory
        shell: bash
        run: echo "R_USER_CACHE_DIR=$RUNNER_TEMP/r-user-cache" >> "$GITHUB_ENV"

      # CmdStan and the compiled bisonR models are cached separately. CmdStan is
      # saved straight after a successful install; models only after a
      # successful job, so a cancelled job can't save a partial install.
      - name: Restore CmdStan
        id: cmdstan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ matrix.config.r }}

      - name: Restore compiled models
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: models-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ matrix.config.r }}-${{ hashFiles('inst/stan/*.stan') }}

      - name: Install CmdStan
        id: install-cmdstan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        shell: Rscript {0}
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2)
          stopifnot(file.exists(file.path(cmdstanr::cmdstan_path(), "bin")))

      - name: Save CmdStan
        if: steps.install-cmdstan.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ matrix.config.r }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'

      # Saved even if the check fails or is cancelled, so later runs don't have
      # to rebuild CmdStan or recompile the models.
      - name: Save compiled models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: models-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ matrix.config.r }}-${{ hashFiles('inst/stan/*.stan') }}
